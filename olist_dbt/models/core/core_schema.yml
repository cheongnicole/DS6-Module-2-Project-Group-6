version: 2

models:
  # fct_orders table
  - name: fct_orders
    description: "Fact Orders"
    columns:
      - name: order_id
        description: "The PK for this table"
        data_tests:
          - unique
          - not_null
      - name: order_status
        tests:
          - not_null
      - name: order_total_price
        tests:
          - not_null

  # fct_order_items table
  - name: fct_order_items
    description: "Fact Order Items"
    columns:
      - name: order_id
        description: "The FK to Orders table"
        data_tests:
          - not_null
  
  # fct_order_reviews table
  - name: fct_order_reviews
    description: "Fact Order Reviews"
    columns:
      - name: review_id
        description: "The PK for this table"
        data_tests:
          - not_null
      - name: order_id
        description: "The FK to Orders table"
        data_tests:
          - not_null

  # dim_products table
  - name: dim_products
    description: "Dimension Products"
    columns:
      - name: product_id
        description: "The PK for this table"
        data_tests:
          - unique
          - not_null
      - name: product_category_name
        description: "In English"
        data_tests:
          - not_null
