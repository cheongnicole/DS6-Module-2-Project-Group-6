version: 2

models:
  - name: stg_orders
    description: "Staging view for orders"
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]

  - name: stg_customers
    description: "Staging view for customers"
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: stg_products
    description: "Staging view for products"
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: stg_sellers
    description: "Staging view for sellers"
    columns:
      - name: seller_id
        tests: [unique, not_null]

  - name: stg_order_items
    description: "Staging view for order items"
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
    # composite uniqueness test removed for now

  - name: stg_payments
    description: "Staging view for payments"
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id

  - name: stg_order_reviews
    description: "Staging view for order reviews"
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
    # composite uniqueness test removed for now

  - name: stg_geolocation
    description: "Staging view for geolocation"
    columns:
      - name: geolocation_zip_code_prefix
        tests: [not_null]
      - name: geolocation_lat
        tests: [not_null]
      - name: geolocation_lng
        tests: [not_null]
